# packages/baw-helpers/pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baw-helpers"
dynamic = ["version"]
description = "A core library for interacting with the Bioacoustics Workbench (BAW) API."
# readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "Requests>=2.32.0",
  "urllib3>=2.5.0",
  "dotenv>=0.0.4"
]

[tool.hatch.version]
source = "regex"
path = "version.txt"
pattern = "^(?P<version>.+)$"