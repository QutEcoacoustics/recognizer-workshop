[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recognizer-workshop"
dynamic = ["version"]
description = 'Tools for developing recognizers with perch-hoplite and Ecosounds'
readme = "../../README.md"
requires-python = ">=3.11"
license = { file = "../../LICENSE" } 
keywords = []
authors = [
  { name = "peichins", email = "peichins@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]


dependencies = [

  "panel>=1.7.0",

  # High-level plotting library tightly integrated with Panel
  # used in the explore page for the umap plot
  "holoviews>=1.19.0",

  # For large-scale data rasterization & efficient visualization (e.g. UMAP plots)
  # used in the explore page for the umap plot
  "datashader>=0.16.0",
   
   
  "umap-learn>=0.5.3",

  # Needed to read/write Parquet files and work with arrow tables
  # used for hoplie db creation from parquet files
  "pyarrow==22.0.0",

  "pandas",
  "numpy",

  "matplotlib",

  "tqdm",

  # Caching, parallel computation, or model persistence
  # used for umap generation and caching
  "joblib",

  # utility for reconstructing nested dataclasses from JSON
  # Used for loading agile config
  "dacite",

  # Color palettes for datashader/holoviews visualizations
  # Used for palettes in explore page of panel ui
  "colorcet",

  # Material UI component styling for Panel dashboards
  "panel_material_ui",


]


[project.optional-dependencies]
jupyter = [

  # Required for interactive widgets in Jupyter notebooks
  "ipywidgets>=8.1.0",

  # Bridges Panel/Bokeh objects to render nicely inside notebooks
  "jupyter_bokeh",

  # Note: we intentionally do NOT include jupyter-server, jupyterlab,
  # or jupyter-server-proxy here. Those are provided by TLJH on the server,
  # and pinning them here risks version conflicts.
]










[project.urls]
Documentation = "https://github.com/QutEcoacoustics/recognizer-workshop#readme"
Issues = "https://github.com/QutEcoacoustics/recognizer-workshop/issues"
Source = "https://github.com/QutEcoacoustics/recognizer-workshop"

[project.scripts]
recognizer-workshop-serve = "recognizer_workshop.ui.panel.serve:main"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/recognizer_workshop/__about__.py"

[tool.hatch.envs.default]

# [tool.hatch.envs.default.overrides]
# path = { "baw-helpers" = "../baw-helpers", "perch-hoplite" = "../../libs/perch-hoplite" }


[tool.hatch.envs.test]
template = "default"
dev-mode = true
dependencies = ["pytest>=7.0", "pytest-cov"]
pre-install-commands = [
  "python -m pip install -e {root:parent}/baw-helpers",
  "python -m pip install -e {root:parent:parent}/libs/perch-hoplite",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/recognizer_workshop tests}"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
  "src/recognizer_workshop/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]



[tool.pytest.ini_options]
testpaths = [
    "tests",
]


[tool.hatch.build.targets.wheel]
packages = ["src/recognizer_workshop"]
include = [
  { path = "src/recognizer_workshop/resources/embedding_configs/*.json", formats = ["wheel", "sdist"] }
]

[tool.hatch.build]
# Include non-Python resources in both sdist and wheel
include = [
  "src/recognizer_workshop/resources/embedding_configs/*.json",
]

[tool.hatch.build.targets.sdist]
# (Optional) Explicitly include in sdist as well; top-level include already covers it,
# but this makes the intent clear.
include = [
  "src/recognizer_workshop/resources/embedding_configs/*.json",
]