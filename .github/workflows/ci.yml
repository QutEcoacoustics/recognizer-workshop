name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m venv .ci-venv
          source .ci-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e packages/baw-helpers
          python -m pip install --no-cache-dir -e packages/recognizer-workshop
          python -m pip install --upgrade pytest scipy

      - name: Run tests
        run: |
          source .ci-venv/bin/activate
          PYTEST_TOKEN_POLICY=skip pytest -q packages/recognizer-workshop/tests packages/baw-helpers/tests
